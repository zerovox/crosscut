name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp asset URLs with the commit
        # Pages serves every file with max-age=600, so a browser can pair a
        # freshly revalidated index.html with a script still in its cache.
        # Giving each deploy its own asset URLs makes that impossible.
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
